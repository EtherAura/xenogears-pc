name: Release source

# Attaches the source of each release to it: xenogears-pc-<version>.tar.gz, the
# tree at the release's tag as git archive writes it (tracked files only, so
# nothing untracked and no game data), its .sha256, a CycloneDX SBOM of the
# tarball's files (xenogears-pc-<version>.cdx.json), and a build-provenance
# attestation for the tarball (verify it with `gh attestation verify`).
# Tags are CalVer, vYYYY.MM.N; anything else is refused before checkout.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing release tag (vYYYY.MM.N) to attach the source to again"
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  source:
    name: source tarball, SBOM and provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write      # gh release upload
      id-token: write      # the attestation's signing identity
      attestations: write  # store the attestation
    steps:
      # The tag reaches the shell only through the environment, never as text in the script.
      - name: Validate the tag
        id: tag
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]{4}\.(0[1-9]|1[0-2])\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::not a release tag (vYYYY.MM.N): $(printf '%q' "$TAG")"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          persist-credentials: false

      - name: Archive the tagged tree
        id: archive
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          name="xenogears-pc-$VERSION"
          commit=$(git rev-parse --verify "refs/tags/$TAG^{commit}")  # before any file: a missing tag writes none
          mkdir -p dist
          git archive --format=tar.gz --prefix="$name/" -o "dist/$name.tar.gz" "$commit"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "tarball=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=dist/$name.tar.gz.sha256" >> "$GITHUB_OUTPUT"

      - name: Attest the tarball's provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.archive.outputs.tarball }}

      # The SBOM describes the tarball's own files: they are unpacked outside the
      # checkout and Syft scans only that copy, never the workspace.
      - name: Unpack the tarball for the SBOM
        id: sbom-source
        env:
          TARBALL: ${{ steps.archive.outputs.tarball }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          name="xenogears-pc-$VERSION"
          dir="$RUNNER_TEMP/sbom-source"
          mkdir "$dir"
          tar -xzf "$TARBALL" -C "$dir"
          test -d "$dir/$name"
          echo "tree=$dir/$name" >> "$GITHUB_OUTPUT"
          echo "sbom=dist/$name.cdx.json" >> "$GITHUB_OUTPUT"

      # Uploads are this workflow's own, below: none by the action itself.
      - name: Generate the CycloneDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: ${{ steps.sbom-source.outputs.tree }}
          format: cyclonedx-json
          output-file: ${{ steps.sbom-source.outputs.sbom }}
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Check the SBOM
        env:
          SBOM: ${{ steps.sbom-source.outputs.sbom }}
        run: |
          if ! [[ -s "$SBOM" ]]; then
            echo "::error::no SBOM was written at $SBOM"
            exit 1
          fi
          python3 -c 'import json, sys; d = json.load(open(sys.argv[1])); sys.exit(not (isinstance(d, dict) and d.get("bomFormat") == "CycloneDX" and d.get("specVersion")))' "$SBOM"

      - name: Attach the tarball, its checksum and its SBOM to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          TARBALL: ${{ steps.archive.outputs.tarball }}
          CHECKSUM: ${{ steps.archive.outputs.checksum }}
          SBOM: ${{ steps.sbom-source.outputs.sbom }}
        run: |
          gh release upload "$TAG" "$TARBALL" "$CHECKSUM" "$SBOM" --repo "$GITHUB_REPOSITORY" --clobber
