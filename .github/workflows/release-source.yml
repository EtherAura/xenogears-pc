name: Release source

# Attaches the source of each release to it: xenogears-pc-<version>.tar.gz, the
# tree at the release's tag as git archive writes it (tracked files only, so
# nothing untracked and no game data), its .sha256, a CycloneDX SBOM of the
# tarball's files (xenogears-pc-<version>.cdx.json), a build-provenance
# attestation for the tarball (verify it with `gh attestation verify`), and the
# Arch Linux PKGBUILD of that tarball (packaging/arch_assets.py).
# Tags are CalVer, vYYYY.MM.N; anything else is refused before checkout.
# Upload routes: a published release, and a dispatch that leaves upload_mode at
# legacy, attach the files to the release as they always have (replacing
# same-named files). Only a dispatch that selects upload_mode draft takes the
# draft route: it needs an existing draft release for the tag (made, with its
# notes, by the release integrator), adds this job's four files to it without
# replacing any file, then downloads exactly those four and checks their names
# and bytes and the checksum against the tarball. It never creates, edits or
# publishes a release and leaves the notes and every other file as they are.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing release tag (vYYYY.MM.N) to attach the source to again"
        required: true
        type: string
      upload_mode:
        description: "legacy: attach to the release as before; draft: add the files to the existing draft for the tag, replacing nothing"
        required: false
        type: choice
        options:
          - legacy
          - draft
        default: legacy

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  source:
    # The FreeBSD package release already carries its checked source archive.
    if: github.event_name != 'release' || !endsWith(github.event.release.tag_name, '-freebsd')
    name: source tarball, SBOM and provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write      # gh release upload
      id-token: write      # the attestation's signing identity
      attestations: write  # store the attestation
    steps:
      # The tag reaches the shell only through the environment, never as text in the script.
      - name: Validate the tag
        id: tag
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]{4}\.(0[1-9]|1[0-2])\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::not a release tag (vYYYY.MM.N): $(printf '%q' "$TAG")"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # Any event but a dispatch is legacy, whatever the input says; a dispatch
      # is draft only when draft is selected, and an unknown mode stops the job.
      - name: Choose the upload route
        id: route
        env:
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.upload_mode }}
        run: |
          if [[ "$EVENT" != workflow_dispatch ]]; then
            route=legacy
          elif [[ "$MODE" == draft ]]; then
            route=draft
          elif [[ "$MODE" == legacy || -z "$MODE" ]]; then
            route=legacy
          else
            echo "::error::not an upload mode (legacy or draft): $(printf '%q' "$MODE")"
            exit 1
          fi
          echo "route=$route" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          persist-credentials: false

      - name: Archive the tagged tree
        id: archive
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          name="xenogears-pc-$VERSION"
          commit=$(git rev-parse --verify "refs/tags/$TAG^{commit}")  # before any file: a missing tag writes none
          mkdir -p dist
          git archive --format=tar.gz --prefix="$name/" -o "dist/$name.tar.gz" "$commit"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "tarball=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=dist/$name.tar.gz.sha256" >> "$GITHUB_OUTPUT"

      - name: Attest the tarball's provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.archive.outputs.tarball }}

      # The SBOM describes the tarball's own files: they are unpacked outside the
      # checkout and Syft scans only that copy, never the workspace.
      - name: Unpack the tarball for the SBOM
        id: sbom-source
        env:
          TARBALL: ${{ steps.archive.outputs.tarball }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          name="xenogears-pc-$VERSION"
          dir="$RUNNER_TEMP/sbom-source"
          mkdir "$dir"
          tar -xzf "$TARBALL" -C "$dir"
          test -d "$dir/$name"
          echo "tree=$dir/$name" >> "$GITHUB_OUTPUT"
          echo "sbom=dist/$name.cdx.json" >> "$GITHUB_OUTPUT"

      # Uploads are this workflow's own, below: none by the action itself.
      - name: Generate the CycloneDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ${{ steps.sbom-source.outputs.tree }}
          format: cyclonedx-json
          output-file: ${{ steps.sbom-source.outputs.sbom }}
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Check the SBOM
        env:
          SBOM: ${{ steps.sbom-source.outputs.sbom }}
        run: |
          if ! [[ -s "$SBOM" ]]; then
            echo "::error::no SBOM was written at $SBOM"
            exit 1
          fi
          python3 -c 'import json, sys; d = json.load(open(sys.argv[1])); sys.exit(not (isinstance(d, dict) and d.get("bomFormat") == "CycloneDX" and d.get("specVersion")))' "$SBOM"

      # The tagged tree's own renderer stamps the PKGBUILD from this job's tarball
      # and .sha256, checking the tarball's bytes against the checksum, into a
      # fresh folder outside the checkout. It runs before any upload: a bad tag,
      # tarball or checksum stops the job with nothing attached.
      - name: Render the Arch PKGBUILD
        id: arch
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          TARBALL: ${{ steps.archive.outputs.tarball }}
          CHECKSUM: ${{ steps.archive.outputs.checksum }}
        run: |
          dir="$RUNNER_TEMP/arch-package"
          mkdir "$dir"
          python3 -I packaging/arch_assets.py --tag="$TAG" --sha256="$CHECKSUM" --tarball="$TARBALL" --out-dir="$dir"
          test -f "$dir/PKGBUILD"
          echo "pkgbuild=$dir/PKGBUILD" >> "$GITHUB_OUTPUT"

      - name: Attach the tarball, its checksum and its SBOM to the release
        if: steps.route.outputs.route == 'legacy'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          TARBALL: ${{ steps.archive.outputs.tarball }}
          CHECKSUM: ${{ steps.archive.outputs.checksum }}
          SBOM: ${{ steps.sbom-source.outputs.sbom }}
        run: |
          gh release upload "$TAG" "$TARBALL" "$CHECKSUM" "$SBOM" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Attach the Arch PKGBUILD to the release
        if: steps.route.outputs.route == 'legacy'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          PKGBUILD: ${{ steps.arch.outputs.pkgbuild }}
        run: |
          gh release upload "$TAG" "$PKGBUILD" --repo "$GITHUB_REPOSITORY" --clobber

      # The draft route (upload_mode draft only). Any failure ends the job: there
      # is no fallback to the legacy route, nothing is replaced, and the release
      # is never created, edited or published here.
      - name: Add the four files to the existing draft and check them
        id: draft
        if: steps.route.outputs.route == 'draft'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          TARBALL: ${{ steps.archive.outputs.tarball }}
          CHECKSUM: ${{ steps.archive.outputs.checksum }}
          SBOM: ${{ steps.sbom-source.outputs.sbom }}
          PKGBUILD: ${{ steps.arch.outputs.pkgbuild }}
        run: |
          files=("$TARBALL" "$CHECKSUM" "$SBOM" "$PKGBUILD")
          names=()
          for f in "${files[@]}"; do
            test -s "$f"
            names+=("${f##*/}")
          done
          check='
          import hashlib, json, os, sys
          stage, tag, path, *names = sys.argv[1:]
          if stage == "files":
              got = sorted(os.listdir(path))
              tarball = open(os.path.join(path, names[0]), "rb").read()
              sidecar = open(os.path.join(path, names[1]), "rb").read()
              want = (hashlib.sha256(tarball).hexdigest() + "  " + names[0] + "\n").encode()
              problem = None if got == sorted(names) and sidecar == want else "the downloaded files are not exactly the four of this job, or the checksum is not of the tarball"
          else:
              rel = json.load(open(path))
              have = [a.get("name") for a in rel.get("assets") or []]
              if rel.get("tagName") != tag or rel.get("isDraft") is not True:
                  problem = "not a draft release for this tag"
              elif stage == "before" and set(names) & set(have):
                  problem = "already holds a file of this job: " + " ".join(sorted(set(names) & set(have)))
              elif stage == "after" and any(have.count(n) != 1 for n in names):
                  problem = "does not hold each file of this job exactly once"
              else:
                  problem = None
          if problem:
              print("::error::" + tag + " (" + stage + "): " + problem)
              sys.exit(1)
          '
          state="$RUNNER_TEMP/draft-release"
          mkdir "$state" "$state/download"
          # The draft must exist, and hold none of these names, before anything is sent.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,assets > "$state/before.json"
          python3 -I -c "$check" before "$TAG" "$state/before.json" "${names[@]}"
          gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,assets > "$state/after.json"
          python3 -I -c "$check" after "$TAG" "$state/after.json" "${names[@]}"
          for n in "${names[@]}"; do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$state/download" --pattern "$n"
          done
          for i in "${!names[@]}"; do
            cmp -- "${files[$i]}" "$state/download/${names[$i]}"
          done
          (cd "$state/download" && sha256sum --strict -c -- "${names[1]}")
          python3 -I -c "$check" files "$TAG" "$state/download" "${names[@]}"
          echo "uploaded=${names[*]}" >> "$GITHUB_OUTPUT"
