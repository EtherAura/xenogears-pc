name: macOS module reset

on:
  push:
    branches: [main]
    paths: &inputs
      - .github/workflows/macos-modules.yml
      - port/src/system/test/macos_modules/**
      - port/src/system/memory.c
      - port/src/system/*.h
      - port/CMakeLists.txt
      - port/cmake/*module*.cmake
      - src/field/**
      - src/battle/**
      - port/src/game/**
      - include/**
      - config/us/**
      - tools/pc_macho.py
      - tools/pc_sources.py
      - tools/pc_srcdata.py
      - tools/pc_link.py
      - tools/payload*.py
  pull_request:
    paths: *inputs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  module-reset:
    name: Link and reset two modules on Apple Silicon
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Identify native host and toolchain
        run: |
          uname -sm
          test "$(uname -sm)" = "Darwin arm64"
          sw_vers
          xcodebuild -version
          xcrun clang --version
          # What this compiler makes of a tentative definition when no flag says: common or defined.
          printf 'int tentative;\n' > "$RUNNER_TEMP/tentative.c"
          xcrun clang -c "$RUNNER_TEMP/tentative.c" -o "$RUNNER_TEMP/tentative.o"
          nm -m "$RUNNER_TEMP/tentative.o"
      - name: Link, scan and execute disc-free fixture
        run: python3 port/src/system/test/macos_modules/run.py
      - name: Link and reset US Original field and battle
        run: |
          python3 -m venv "$RUNNER_TEMP/xg-python"
          source "$RUNNER_TEMP/xg-python/bin/activate"
          python -m pip install --disable-pip-version-check PyYAML==6.0.3
          python tools/pc_sources.py
          build="$RUNNER_TEMP/xg-game-modules"
          cmake -S port -B "$build" -G Ninja -DXG_DARWIN_MODULE_CHECK=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build "$build" --target darwin_module_check
          file "$build/darwin_module_check"
          python port/src/system/test/macos_modules/game_check.py verify "$build"
