name: CI

# What can be checked without the game. The port itself cannot be built here:
# its link step takes code and data from a retail disc, and no runner has one.
# The full build, and the tests that need a disc or a GPU, are run on the
# maintainer's machine before anything is published to this repository.
#
# So this is the rest: every Python tool compiles, every configuration file
# parses, every shell script parses with the shell it names, and the tool tests
# that need no game data run. MinGW, clang, numpy and Pillow are installed
# because those tests skip their cases without them.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (no game data)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare the APT archive cache
        id: apt-cache
        shell: bash
        run: |
          # Use a path that the unprivileged APT download user can traverse.
          mkdir -m 0755 /tmp/xgpc-apt-archives
          echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/xgpc-apt-archives/*.deb
          key: xgpc-apt-noble-${{ runner.arch }}-${{ hashFiles('.github/workflows/ci.yml') }}-${{ steps.apt-cache.outputs.week }}
          restore-keys: xgpc-apt-noble-${{ runner.arch }}-${{ hashFiles('.github/workflows/ci.yml') }}-

      - name: Install what the checks use
        shell: bash
        run: |
          apt_fetch() {
            local limit=$1 attempt
            shift
            for attempt in 1 2; do
              if sudo timeout --kill-after=5s "$limit" apt-get \
                -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 "$@"; then
                return 0
              fi
              if [[ $attempt == 1 ]]; then
                echo "::warning::APT network step failed, retrying once"
                sleep 5
              fi
            done
            return 1
          }

          apt_fetch 60s -o APT::Update::Error-Mode=any update

          archive_dir=/tmp/xgpc-apt-archives
          packages=(python3-yaml python3-numpy python3-pil gcc libc6-dev clang gcc-mingw-w64-x86-64)
          install_args=(-y --no-install-recommends)
          archive_args=(-o "Dir::Cache::Archives=$archive_dir/")

          # APT checks already cached archives by size. Check restored files
          # against SHA-256 from the fresh package indexes before reusing them.
          plan_dir=$(mktemp -d "$RUNNER_TEMP/xgpc-apt-plan.XXXXXXXX")
          LC_ALL=C apt-get "${install_args[@]}" --print-uris -o Acquire::ForceHash=sha256 \
            -o "Dir::Cache::Archives=$plan_dir/" install "${packages[@]}" > "$plan_dir/plan"
          python3 - "$archive_dir" "$plan_dir/plan" <<'PY'
          import hashlib
          import re
          import sys
          from pathlib import Path

          archive_dir, plan = map(Path, sys.argv[1:])
          checksums = dict(re.findall(
              r"^'[^']+' (\S+\.deb) \d+ SHA256:([a-f0-9]{64})$",
              plan.read_text(), re.MULTILINE,
          ))
          for archive in archive_dir.glob("*.deb"):
              expected = checksums.get(archive.name)
              if expected and not archive.is_symlink() and archive.is_file():
                  with archive.open("rb") as source:
                      if hashlib.file_digest(source, "sha256").hexdigest() == expected:
                          continue
              archive.unlink()
          PY

          apt_fetch 180s "${install_args[@]}" "${archive_args[@]}" --download-only install "${packages[@]}"
          # The network deadlines above only apply before dpkg starts.
          sudo apt-get "${install_args[@]}" "${archive_args[@]}" --no-download install "${packages[@]}"

      # Our own tools and tests; the libraries under port/third_party keep their upstream form.
      - name: Every Python tool compiles
        run: python3 -m compileall -q -x 'third_party' .

      - name: Every configuration file parses
        run: |
          python3 - <<'PY'
          import pathlib, sys, yaml
          bad = 0
          files = sorted(pathlib.Path("config").rglob("*.yaml"))
          for path in files:
              try:
                  yaml.safe_load(path.read_text(encoding="utf-8"))
              except Exception as error:
                  bad += 1
                  print(f"::error file={path}::{str(error).splitlines()[0]}")
          print(f"{len(files)} configuration files, {bad} do not parse")
          sys.exit(1 if bad or not files else 0)
          PY

      - name: Every shell script parses
        run: |
          rc=0
          for f in $(find . -name '*.sh' -not -path './.git/*' -not -path '*/third_party/*'); do
            case "$(head -n 1 "$f")" in
              '#!'*bash*) shell=bash ;;
              *) shell=sh ;;
            esac
            "$shell" -n "$f" || { echo "::error file=$f::$shell -n failed"; rc=1; }
          done
          exit $rc

      # The tests of the tools that read no disc, no extracted file and no build. The others
      # under tools/ (battle speed, game text layout, high refresh, hard profile ids) need a
      # finished build or disc images and are not run here.
      - name: Tool tests
        run: |
          rc=0
          for t in beetle build_release interpolation_coverage link_tables_metadata payloadcheck pc_link \
                   pc_link_asmfree_metadata port_tests retail_heap statecheck; do
            echo "::group::tools/test_$t.py"
            python3 "tools/test_$t.py" || rc=1
            echo "::endgroup::"
          done
          exit $rc
